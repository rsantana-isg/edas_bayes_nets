[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes_nets"
version = "0.1.0"
description = "Discrete Bayesian network learning, sampling, and visualisation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
viz = ["matplotlib", "networkx"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bayes_nets*"]
